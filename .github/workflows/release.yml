name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.15.1"
          version: "0.13.5"

      - name: Build wheel, sdist, and plugin archive
        run: |
          uv sync --frozen --extra dev
          uv run python -m build
          uv run python scripts/build_agent_plugin.py

      - name: Write SHA256SUMS
        run: uv run python scripts/write_release_checksums.py dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          assets=(
            "dist/deepr_research-${version}-py3-none-any.whl"
            "dist/deepr_research-${version}.tar.gz"
            "dist/deepr-agent-plugin-${version}.tar.gz"
            "dist/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Expected the wheel, sdist, plugin archive, and SHA256SUMS for ${tag}." >&2
              echo "Missing ${asset}." >&2
              exit 1
            fi
          done
          # A published immutable release cannot accept assets. Create the
          # release with the files in one step. `gh release create` uploads
          # them while the release is still a draft, then publishes it.
          if is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "Published release ${tag} already exists." >&2
              echo "GitHub immutable releases cannot take new assets." >&2
              echo "Push a new patch tag instead of uploading to ${tag}." >&2
              exit 1
            fi
            echo "Draft release ${tag} already exists." >&2
            echo "This workflow creates the release with its assets in one step and does not upload to an existing release." >&2
            echo "Delete the draft and re-run this workflow, or push a new patch tag." >&2
            exit 1
          fi
          notes_file="${RUNNER_TEMP}/release-notes.md"
          uv run python scripts/release_notes.py "$version" docs/CHANGELOG.md > "$notes_file"
          gh release create "$tag" "${assets[@]}" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$notes_file"
