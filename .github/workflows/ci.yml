name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.15.0"
          version: "0.13.0"

      - name: Install lint tooling
        # uv.lock is the dependency authority used by every Python CI job.
        run: uv sync --frozen --extra dev

      - name: Lint
        run: ruff check src/deepr/

      - name: Security + complexity lint (advisory display)
        # Advisory log of the S-rule (Bandit) and C901 (complexity > 10)
        # findings. The counts are *enforced* (no-growth) by the ratchet step
        # below; this keeps the individual findings visible during review.
        continue-on-error: true
        run: ruff check src/deepr/ --select S,C901

      - name: Code-health ratchets (BLOCKING)
        # Phase Q: the backlog may not grow. check_file_sizes.py fails on any
        # new oversized src/deepr/*.py (existing large files grandfathered, shrink
        # only); check_ratchets.py fails if the C901 or S finding count rises
        # above its committed baseline. See docs/design/code-health.md.
        run: |
          python scripts/check_file_sizes.py
          python scripts/check_ratchets.py
          python scripts/check_paid_api_boundaries.py

      - name: Format check
        run: ruff format --check src/deepr/

      - name: Docs consistency (counts match source)
        run: python scripts/check_docs_consistency.py

      - name: Install Python floor dependency types
        # NumPy 2.5 uses Python 3.12 syntax in its stubs. Resolve the real
        # Python 3.11 branch for floor checking instead of ignoring its types.
        run: UV_PROJECT_ENVIRONMENT=.agent/type-floor uv sync --frozen --python 3.11 --extra dev

      - name: Type check (mypy baseline, non-blocking)
        # Phase E (Engineering Standards): type checking is being introduced
        # incrementally. This runs non-blocking to record the baseline error
        # count in the CI log; it flips to a blocking `--strict` gate
        # package-by-package (core/, providers/, mcp/, security/, queue/, storage/,
        # tools/, routing/, worker/, webhooks/, a2a/, importable skills package
        # first) as annotations land.
        # Config lives in [tool.mypy] in pyproject.toml.
        continue-on-error: true
        run: mypy --python-executable .agent/type-floor/bin/python

      - name: Type check strict islands (mypy --strict, BLOCKING)
        # Phase E: strict-clean islands enforced as a blocking gate - a strict
        # regression in these packages fails the build.
        # --no-warn-unused-ignores: the lint job installs no project deps, so
        # whether a `# type: ignore[import-untyped]` is "used" depends on which
        # third-party packages are present (e.g. PyYAML). Decouple the gate
        # from that so it is reproducible regardless of the install set.
        run: mypy --python-executable .agent/type-floor/bin/python --strict --no-warn-unused-ignores --ignore-missing-imports src/deepr/core src/deepr/providers src/deepr/mcp src/deepr/security src/deepr/queue src/deepr/storage src/deepr/tools src/deepr/routing src/deepr/worker src/deepr/webhooks src/deepr/a2a src/deepr/skills src/deepr/backends src/deepr/agents src/deepr/evals src/deepr/observability src/deepr/services

      - name: Type check promoted runtime dependencies (BLOCKING)
        run: mypy --python-version 3.15 --strict --no-warn-unused-ignores --ignore-missing-imports src/deepr/core src/deepr/providers src/deepr/mcp src/deepr/security src/deepr/queue src/deepr/storage src/deepr/tools src/deepr/routing src/deepr/worker src/deepr/webhooks src/deepr/a2a src/deepr/skills src/deepr/backends src/deepr/agents src/deepr/evals src/deepr/observability src/deepr/services

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.15.0"
          version: "0.13.0"

      - name: Secret scan (Gitleaks, blocking)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --no-banner --no-color --log-level warn

      - name: Dependency audit (pip-audit, blocking)
        # Phase E: BLOCKING. The baseline was cleared (flask-cors bumped past
        # CVE-2024-6839/6844/6866), so a new known vulnerability fails the
        # build. Accepted advisories are pinned explicitly with
        # `--ignore-vuln <ID>` rather than by disabling the gate.
        run: |
          uv sync --frozen --extra dev --extra full
          pip-audit --skip-editable

      - name: Generate SBOM (pinned dependency bill of materials)
        # Phase E: a reproducible, hash-pinned list of every resolved
        # dependency, published as a build artifact for supply-chain audit.
        run: uv export --frozen --no-emit-project --no-dev --format requirements-txt -o sbom-requirements.txt

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-requirements
          path: sbom-requirements.txt
          if-no-files-found: error
          retention-days: 7

  core-install:
    # The dev/test/[full] installs always include numpy, bs4, etc., so a broken
    # *core* install - a runtime import that lives only in an extra - cannot be
    # caught by the unit suite: it ships green and crashes when a core surface
    # imports the missing dependency. Before lazy startup, this happened when
    # numpy lived only in the `docs` extra and every CLI command imported it.
    # This job installs CORE ONLY and exercises the no-network command surface,
    # so that class fails here, not on a user's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          version: "0.13.0"

      - name: Install CORE only (no extras)
        run: uv sync --frozen

      - name: Smoke-test the core CLI (no network, no extras)
        run: |
          deepr --version
          deepr --help
          deepr doctor --skip-connectivity
          deepr init --yes
          deepr expert build --help
          deepr expert knowledge --help
          python -c "from deepr.utils.scrape import ContentExtractor; assert 'Reference content' in ContentExtractor().extract_main_content('<html><body><main><p>Reference content</p></main></body></html>')"
          deepr mcp conformance --json
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from deepr.core.settings import Settings
          from deepr.core.unified_config import UnifiedConfig
          from deepr.experts.okf_contract import parse_markdown_frontmatter

          parsed = parse_markdown_frontmatter("---\ntype: Reference\nprovenance:\n  reviewed: true\n---\nBody\n")
          assert parsed.error is None and parsed.fields["provenance"] == {"reviewed": True}
          unsafe = parse_markdown_frontmatter("---\ntype: !!python/object/apply:os.system ['exit 1']\n---\n")
          assert unsafe.error is not None
          with TemporaryDirectory(prefix="deepr-core-yaml-") as directory:
              config = Path(directory) / "config.yaml"
              config.write_text("default_provider: gemini\nresearch:\n  retry_attempts: 3\n", encoding="utf-8")
              settings = Settings.load(config_path=config, reset_singleton=True)
              assert settings.default_provider == "gemini" and settings.research.retry_attempts == 3
              assert UnifiedConfig.load(config_path=config).default_provider == "gemini"
          PY

  agent-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.15.0"
          version: "0.13.0"

      - name: Build Python and Agent Plugin distributions
        run: |
          uv sync --frozen --extra dev
          uv run pytest -q \
            tests/unit/test_standards/test_external_standards_pins.py \
            tests/unit/test_skill/test_agent_skills_contract.py \
            tests/unit/test_skill/test_agent_plugin_package.py \
            tests/unit/test_agent_plugin_install.py \
            tests/unit/test_mcp/test_server_bridge_hardening.py
          uv run python -m build
          uv run python scripts/build_agent_plugin.py --output dist/deepr-agent-plugin-first.tar.gz
          uv run python scripts/build_agent_plugin.py --output dist/deepr-agent-plugin-second.tar.gz
          cmp dist/deepr-agent-plugin-first.tar.gz dist/deepr-agent-plugin-second.tar.gz

      - name: Install the wheel in a clean environment
        run: |
          mkdir -p "${RUNNER_TEMP}/deepr-wheelhouse"
          uv export --frozen --no-emit-project --no-dev --format requirements-txt \
            -o "${RUNNER_TEMP}/deepr-core-requirements.txt"
          PYYAML_FORCE_LIBYAML=0 .venv/bin/python -m pip wheel --require-hashes \
            --wheel-dir "${RUNNER_TEMP}/deepr-wheelhouse" \
            -r "${RUNNER_TEMP}/deepr-core-requirements.txt"
          cp "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" "${RUNNER_TEMP}/deepr-wheelhouse/"
          uv venv .agent-plugin-venv --python 3.15.0
          uv pip install \
            --offline \
            --no-index \
            --find-links "${RUNNER_TEMP}/deepr-wheelhouse" \
            --python .agent-plugin-venv/bin/python \
            "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Prove contained read-only stdio operation
        run: |
          mkdir -p "${RUNNER_TEMP}/deepr agent plugin extracted"
          tar -xzf dist/deepr-agent-plugin-first.tar.gz \
            -C "${RUNNER_TEMP}/deepr agent plugin extracted"
          .agent-plugin-venv/bin/python scripts/check_agent_plugin_install.py \
            --package-root "${RUNNER_TEMP}/deepr agent plugin extracted/deepr-research" \
            --data-root "${RUNNER_TEMP}/deepr agent plugin data" \
            --command .agent-plugin-venv/bin/deepr-mcp
          .agent-plugin-venv/bin/python scripts/check_host_profile_install.py \
            --fixture tests/fixtures/hosts/openclaw/v2026.7.1-2/profile.json \
            --data-root "${RUNNER_TEMP}/deepr-openclaw-profile-data" \
            --mcp-command .agent-plugin-venv/bin/deepr-mcp \
            --deepr-command .agent-plugin-venv/bin/deepr

  frontend:
    # The web frontend was previously verified only by hand: CI never ran
    # lint/tsc/build, so a dangling identifier that broke type-checking and
    # a missing ESLint config both survived for months (found 2026-06-11
    # while verifying dependency bumps locally). This job closes that gap.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/deepr/web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: src/deepr/web/frontend/package-lock.json

      - name: Install npm
        run: npm install --global npm@12.0.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit (npm, blocking)
        run: npm audit --audit-level=high

      - name: Lint (eslint, zero warnings)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install browser for isolated interface checks
        run: npx playwright install --with-deps chromium

      - name: Browser workflow regressions (synthetic, no backend)
        run: node qa/local-ui.mjs

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Production build (vite)
        run: npx vite build

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.15.0"
          version: "0.13.0"

      - name: Verify committed frontend archive is current
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/build_frontend_archive.py
          git diff --exit-code -- src/deepr/web/frontend/frontend-dist.zip

      - name: Build Python distributions with packaged frontend
        working-directory: ${{ github.workspace }}
        run: |
          uv sync --frozen --extra dev
          uv run python -m build

      - name: Verify Python distribution contents
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/check_wheel_frontend.py \
            "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

  platform-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          version: "0.13.0"
      - name: Install the frozen full test environment
        run: uv sync --frozen --extra dev --extra full
      - name: Exercise export boundaries and installer ownership
        run: python -m pytest -q tests/unit/test_experts/test_okf_publication.py tests/unit/test_installer_ownership.py tests/unit/test_release_installers.py tests/unit/test_cli/test_upgrade.py
      - name: Audit the platform dependency branch
        run: pip-audit --skip-editable
      - name: Build the wheel
        run: python -m build
      - name: Verify a clean core wheel and native entry points
        run: python scripts/check_platform_install.py --dist-dir dist --runtime-root ".agent/platform install"
      - name: Retain platform receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python-version }}
          path: .agent/platform install/*.log
          if-no-files-found: warn
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: stdio
            dockerfile: Dockerfile
          - surface: worker
            dockerfile: deploy/aws/src/worker/Dockerfile
          - surface: http
            dockerfile: deploy/mcp-http/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the locked image without deployment
        run: docker build --pull --file "${{ matrix.dockerfile }}" --tag "deepr-platform:${{ matrix.surface }}" .
      - name: Verify runtime imports without network access
        run: >-
          docker run --rm --network none --entrypoint python "deepr-platform:${{ matrix.surface }}"
          -c "import sys, shutil, deepr, numpy, yaml; assert shutil.which('gcc') is None; assert sys.version_info[:2] == (3, 15); assert sys.version_info.releaselevel == 'final'; assert yaml.safe_load('safe: true') == {'safe': True}; assert float(numpy.dot([1., 2.], [3., 4.])) == 11.; print(deepr.__version__)"
      - name: Verify offline MCP conformance as the runtime user
        run: >-
          docker run --rm --network none --env PYTHON_DOTENV_DISABLED=1
          --env DEEPR_DATA_DIR=/tmp/deepr-platform --entrypoint deepr "deepr-platform:${{ matrix.surface }}"
          mcp conformance --json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Every maintained ordinary CPython minor is a blocking full-suite gate.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra full

      - name: Audit the Python 3.11 dependency branch
        if: matrix.python-version == '3.11'
        run: pip-audit --skip-editable

      - name: Unit tests with coverage
        # Coverage threshold lives in pyproject.toml (currently 80%).
        # Do NOT pass --cov-fail-under here - it would silently override
        # the pyproject setting and allow coverage to drop without
        # tripping CI (R4 audit caught this discrepancy).
        run: python -m pytest tests/unit/ --ignore=tests/data -q --tb=short --cov=deepr --cov-report=term-missing

      - name: Enforce coverage gate
        # pytest-cov printed "FAIL Required test coverage ..." on 3.12/3.13
        # without failing the step (observed 2026-06-11: jobs green at 79.75%
        # against an 80% gate; only 3.14 propagated the failure). Enforce the
        # gate explicitly and version-independently: `coverage report` reads
        # fail_under from pyproject (single source of truth) and exits 2 when
        # the total is below it.
        run: python -m coverage report > /dev/null
